<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b24"><title>StoryVerse — Stories beyond imagination</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--bg:#100b24;--panel:#1b1434;--text:#f7f1ff;--muted:#b8accd;--pink:#ff5ebc;--violet:#9d7bff;--cyan:#5be5e2;--line:#ffffff1b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#44216b 0,transparent 38%),radial-gradient(ellipse at 90% 20%,#163b61 0,transparent 32%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,6vw,80px);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);position:sticky;top:0;background:#100b24d9;z-index:3}
.brand{font:700 22px Cinzel,serif;letter-spacing:1px}.brand span{color:var(--pink)}button,input{font:inherit}.btn{border:1px solid #ffffff30;background:#ffffff0c;color:var(--text);padding:10px 15px;border-radius:12px;cursor:pointer}.btn:hover,.btn.active{background:linear-gradient(110deg,#9d7bff66,#ff5ebc55);border-color:#c8a9ff}
main{max-width:1200px;margin:auto;padding:38px 22px 70px}.hero{padding:48px 0 35px;max-width:720px}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:700}.hero h1{font:700 clamp(38px,7vw,68px) 'Playfair Display',serif;line-height:1.08;margin:14px 0}.gradient{background:linear-gradient(90deg,var(--pink),#b49aff,var(--cyan));background-clip:text;color:transparent}.hero p,.muted{color:var(--muted);line-height:1.7}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.search{flex:1;min-width:190px;background:#ffffff10;border:1px solid var(--line);border-radius:12px;padding:12px 15px;color:white;outline:none}.filters{display:flex;gap:8px;flex-wrap:wrap}.section-title{font:600 25px 'Playfair Display',serif;margin:35px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}.story{border:1px solid var(--line);background:linear-gradient(145deg,#ffffff12,#ffffff05);border-radius:20px;overflow:hidden;cursor:pointer;transition:.25s}.story:hover{transform:translateY(-5px);border-color:#c69cff88;box-shadow:0 16px 45px #0005}.cover{height:150px;padding:18px;display:flex;align-items:end;background:linear-gradient(135deg,#4c2678,#b83e87)}.cover:nth-child(odd){background:linear-gradient(135deg,#14556b,#5d3b94)}.cover b{font:700 24px 'Playfair Display',serif;text-shadow:0 2px 12px #0008}.story-body{padding:17px}.tag{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:1.5px}.story h3{margin:8px 0;font:600 20px 'Playfair Display',serif}.story p{color:var(--muted);font-size:13px;line-height:1.5}.read{color:#ff9bd4;font-weight:700;font-size:13px}
#reader{display:none}.reader-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.reader-card{max-width:800px;margin:28px auto;padding:clamp(22px,5vw,52px);background:linear-gradient(145deg,#21183e,#17112e);border:1px solid #ffffff20;border-radius:24px;box-shadow:0 22px 70px #0005}.reader-card h1{font:700 clamp(28px,5vw,44px) 'Playfair Display',serif}.chapter-title{color:var(--cyan);margin:24px 0}.prose{font:18px/1.95 Georgia,serif;color:#eee5fa;white-space:pre-line}.progress{height:4px;background:#ffffff20;border-radius:9px;margin:22px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:9px}.reader-controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}.small{font-size:12px;color:var(--muted)}footer{text-align:center;color:#9f91b7;padding:30px;font-size:12px}
body.light{--bg:#f4efff;--panel:#fff;--text:#24163c;--muted:#695d7e;--line:#27164b20;background:radial-gradient(ellipse at 15% 0%,#e8c8ff,transparent 40%),#f4efff}body.light header{background:#f4efffdc}body.light .reader-card{background:#fff}body.light .prose{color:#302442}body.light .search{color:#24163c;background:#fff}
@media(max-width:600px){header{padding:16px}.hero{padding-top:30px}.reader-card{padding:22px 18px}.prose{font-size:16px}}
</style></head>
<body>
<header><div class="brand">✦ STORY<span>VERSE</span></div><button class="btn" id="theme">☼ Theme</button></header>
<main>
<section id="library">
<div class="hero"><div class="eyebrow">A universe of imagination</div><h1>Every story opens<br><span class="gradient">another world.</span></h1><p>Find your next escape. Explore magical worlds, hidden mysteries and unforgettable journeys — one chapter at a time.</p></div>
<div class="toolbar"><input id="search" class="search" placeholder="Search stories..." aria-label="Search stories"><div class="filters" id="filters"></div></div>
<h2 class="section-title">Explore stories</h2><div class="grid" id="stories"></div>
</section>
<section id="reader">
<div class="reader-top"><button class="btn" id="back">← All stories</button><div><button class="btn" id="ambient">♫ Ambient: Off</button> <button class="btn" id="fontDown">A−</button> <button class="btn" id="fontUp">A+</button></div></div>
<div class="reader-card"><div class="tag" id="readerTag"></div><h1 id="readerTitle"></h1><div class="small" id="chapterCount"></div><div class="progress"><i id="progress"></i></div><h2 class="chapter-title" id="chapterTitle"></h2><article class="prose" id="prose"></article><div class="reader-controls"><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next chapter →</button></div><p class="small" style="text-align:center;margin-top:18px"><label><input type="checkbox" id="auto"> Automatically open next chapter after 30 seconds</label></p></div>
</section></main><footer>Made for curious minds · StoryVerse</footer>
<script>
const stories=[
{id:1,title:'The Moonlight Library',category:'Fantasy',desc:'A hidden library appears only when the moon is full.',chapters:[['The Silver Door','At the end of a narrow street stood a door no map had ever shown. Its silver handle shimmered beneath the moon. Mira had walked past the empty wall a hundred times, but tonight a warm light glowed behind the glass.\n\nShe turned the handle. Inside, thousands of books floated gently beneath a ceiling full of stars. A librarian in a midnight-blue coat looked up. “We have been waiting for you,” he whispered.'],['The Book That Remembered','A small book drifted from a high shelf and opened in Mira’s hands. Its pages held memories she had never lived: a ship crossing a violet sea, a city built in clouds, and a promise made beneath an ancient tree.\n\nAt the bottom of the final page, fresh ink appeared: Find the story that has forgotten its ending.'],['Beyond the Last Shelf','Behind the last shelf, Mira found a staircase descending into blue light. She took one breath and stepped forward. Somewhere below, a bell rang — the sound of a new story beginning.']]},
{id:2,title:'Whispers of the Ocean',category:'Adventure',desc:'A mysterious melody leads a young sailor to a lost island.',chapters:[['The Blue Note','Every evening, Aran heard a melody rising from the sea. It was soft as rain and clear as a bell. The fishermen said it was only the wind, but Aran knew the tune changed whenever the tide turned.'],['Map of Tides','Inside an old bottle he found a map drawn in blue ink. It showed no coastlines, only waves and a small star beyond the eastern reef. At sunrise, Aran set sail with the melody in his heart.'],['The Island That Sings','The island appeared through the mist, covered in silver grass. When Aran stepped ashore, the ground hummed beneath his feet. The ocean had not been calling him to treasure, but to a song waiting to be heard.']]},
{id:3,title:'The Clockmaker’s Secret',category:'Mystery',desc:'An antique clock ticks backwards — and reveals a secret.',chapters:[['One Minute Before','In a quiet shop, a brass clock began ticking backwards. Every midnight it returned one minute to the past. Nila noticed that the clock stopped whenever she touched its tiny engraved star.'],['The Hidden Gear','Behind the clock face was a folded letter and a photograph of a house that had vanished years ago. The letter carried only one instruction: “Come when the hands meet.”'],['The Final Chime','At midnight, the hands met. A hidden drawer opened, revealing the missing key to the old house. Nila smiled. The mystery had not travelled through time; it had simply waited for someone to listen.']]},
{id:4,title:'The Secret Garden',category:'Fantasy',desc:'A forgotten garden helps a lonely child find hope.',chapters:[['The Rusted Gate','Behind the old stone wall, a rusted gate stood covered in ivy. When Tara pushed it open, the scent of jasmine filled the air. A garden slept there, waiting for spring.'],['Seeds of Hope','She planted three tiny seeds and visited every day. Slowly, green shoots appeared. The garden grew brighter, and so did the quiet corners of Tara’s heart.'],['A Garden for Everyone','By summer, the gate stood open. Neighbours came with flowers, stories and laughter. Tara had discovered that some beautiful things grow when they are shared.']]},
{id:5,title:'The Last Star Keeper',category:'Sci-Fi',desc:'The final guardian of the stars receives one last signal.',chapters:[['A Signal in the Dark','On a station beyond Neptune, Iven cared for the star beacons. One night, a signal arrived from a beacon that had been silent for a century. It contained a single word: Remember.'],['Light Years Away','Iven followed the signal through a field of sleeping satellites. Each beacon awakened as the ship passed, painting the darkness with distant light.'],['The New Constellation','At the source, Iven found a message from the first star keepers: the lights were never meant to be guarded alone. Iven sent the signal outward, inviting every world to become part of the constellation.']]},
{id:6,title:'Letters in the Rain',category:'Romance',desc:'Two strangers connect through letters left at a bus stop.',chapters:[['The First Letter','On a rainy Tuesday, Kavin found a folded note beneath the bus-stop bench. It said, “If today feels heavy, I hope tomorrow is kinder.” He left a reply in the same place the next morning.'],['Ink and Raindrops','For weeks, the letters travelled between strangers. They shared small joys, old fears and favourite songs, never asking for names. The rainy bus stop became their favourite place.'],['Under One Umbrella','One evening, Kavin arrived to find someone holding the final letter. They laughed at the same familiar handwriting. Outside, the rain continued, but neither hurried away.']] }
];
let active=null,chapter=0,fontSize=18,autoTimer=null,audioCtx=null,osc=null,gain=null,category='All';
const $=id=>document.getElementById(id);
function renderFilters(){const cats=['All',...new Set(stories.map(s=>s.category))];$('filters').innerHTML=cats.map(c=>'<button class="btn '+(category===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderFilters();renderStories()})}
function renderStories(){const q=$('search').value.toLowerCase();const list=stories.filter(s=>(category==='All'||s.category===category)&&(s.title+' '+s.desc+' '+s.category).toLowerCase().includes(q));$('stories').innerHTML=list.map((s,i)=>'<div class="story" data-id="'+s.id+'"><div class="cover" style="background:linear-gradient(135deg,'+['#4c2678,#14556b','#87416d','#275d70','#563b94','#7b4b38'][s.id-1]+',#b83e87)"><b>'+s.title+'</b></div><div class="story-body"><div class="tag">'+s.category+' · '+s.chapters.length+' chapters</div><h3>'+s.title+'</h3><p>'+s.desc+'</p><div class="read">Start reading →</div></div></div>').join('')||'<p class="muted">No stories found. Try another search.</p>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openStory(+el.dataset.id))}
function openStory(id){active=stories.find(s=>s.id===id);chapter=0;$('library').style.display='none';$('reader').style.display='block';renderChapter();window.scrollTo(0,0)}
function renderChapter(){if(!active)return;const c=active.chapters[chapter];$('readerTag').textContent=active.category;$('readerTitle').textContent=active.title;$('chapterCount').textContent='Chapter '+(chapter+1)+' of '+active.chapters.length;$('chapterTitle').textContent=c[0];$('prose').textContent=c[1];$('prose').style.fontSize=fontSize+'px';$('progress').style.width=((chapter+1)/active.chapters.length*100)+'%';$('prev').disabled=chapter===0;$('next').textContent=chapter===active.chapters.length-1?'Back to library ✓':'Next chapter →';clearTimeout(autoTimer);if($('auto').checked&&chapter<active.chapters.length-1)autoTimer=setTimeout(()=>{chapter++;renderChapter()},30000)}
function next(){if(chapter<active.chapters.length-1){chapter++;renderChapter()}else back()}
function back(){$('reader').style.display='none';$('library').style.display='block';clearTimeout(autoTimer);window.scrollTo(0,0)}
$('search').addEventListener('input',renderStories);$('back').onclick=back;$('prev').onclick=()=>{if(chapter>0){chapter--;renderChapter()}};$('next').onclick=next;$('auto').onchange=renderChapter;
$('fontDown').onclick=()=>{fontSize=Math.max(14,fontSize-2);$('prose').style.fontSize=fontSize+'px'};$('fontUp').onclick=()=>{fontSize=Math.min(30,fontSize+2);$('prose').style.fontSize=fontSize+'px'};
$('theme').onclick=()=>document.body.classList.toggle('light');
$('ambient').onclick=()=>{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();osc=audioCtx.createOscillator();gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=110;gain.gain.value=0.025;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();$('ambient').textContent='♫ Ambient: On'}else if(audioCtx.state==='running'){audioCtx.suspend();$('ambient').textContent='♫ Ambient: Off'}else{audioCtx.resume();$('ambient').textContent='♫ Ambient: On'}};
renderFilters();renderStories();
</script></body></html>
